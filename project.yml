name: AppList
options:
  bundleIdPrefix: com.chunui
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
packages:
  ChunUI:
    path: Packages/ChunUI
  ReorderableForEach:
    url: https://github.com/globulus/swiftui-reorderable-foreach
    from: 1.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
schemes:
  AppList:
    build:
      targets:
        AppList: all
    test:
      targets:
        - AppListTests
        - AppListUITests
targets:
  AppList:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    dependencies:
      - package: ChunUI
        product: ChunUI
      - package: ReorderableForEach
        product: SwiftUIReorderableForEach
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nic.applist
        PRODUCT_NAME: AppList
        INFOPLIST_KEY_CFBundleDisplayName: AppList
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright © AppList
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
        Release:
          ENABLE_TESTABILITY: NO
  AppListTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: AppList
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nic.applist.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AppList.app/Contents/MacOS/AppList"
        BUNDLE_LOADER: "$(TEST_HOST)"
  AppListUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
    dependencies:
      - target: AppList
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.nic.applist.uitests
        TEST_TARGET_NAME: AppList
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
